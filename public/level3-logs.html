<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 3 log sheets</title>
<style>
  /* Print document: always black on white, A4 */
  :root{color-scheme:light}
  body{margin:0;background:#e6e6e6;color:#111;font:14px/1.4 "Courier New",ui-monospace,monospace}
  .bar{position:sticky;top:0;background:#222;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif}
  .bar button{font:inherit;padding:6px 14px;cursor:pointer}
  .bar .key{margin-left:auto;font-size:13px;opacity:.85}
  .sheet{background:#fff;width:210mm;max-width:100%;min-height:290mm;margin:16px auto;padding:14mm 12mm;box-sizing:border-box;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.04em}
  h2{font-size:15px;margin:0 0 10px;font-weight:normal}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;border:1.5px solid #111;padding:8px 10px;margin:10px 0 12px;font-size:13px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid #111;padding:5px 6px;text-align:center}
  th{background:#eee;font-size:12px}
  td.l{text-align:left}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px;font-size:13px}
  .sign div{border-top:1px solid #111;padding-top:4px}
  .stamp{display:inline-block;border:2px solid #111;padding:2px 8px;transform:rotate(-4deg);font-weight:bold;letter-spacing:.1em}
  .card ol{padding-left:20px} .card li{margin:8px 0}
  .formula{font-size:18px;border:2px solid #111;display:inline-block;padding:6px 14px;margin:6px 0}
  .msg{max-width:520px;margin:60px auto;font-family:system-ui,sans-serif;background:#fff;padding:20px;border-radius:8px}
  @media print{
    body{background:#fff}
    .bar{display:none}
    .sheet{margin:0;box-shadow:none;width:auto;min-height:0;page-break-after:always}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>
<div class="bar"><b>Level 3 · Blackout log sheets</b><button onclick="print()">Print</button>
  <span class="key" id="key"></span></div>
<div id="out"></div>
<script type="module">
import { api, auth } from '/js/common.js';

const out = document.getElementById('out');
if (auth.role !== 'master') {
  out.innerHTML = '<div class="msg">Log in as <b>master</b> first, then open this page from the Level 3 card.<br><br><a href="/login?role=master">Go to login</a></div>';
  throw new Error('master only');
}
const S = await api.state();
const answer = parseInt(S.settings?.answers?.[3], 10);
if (!(answer >= 110 && answer <= 985)) {
  out.innerHTML = '<div class="msg">Set the Level 3 answer on the master Setup page to a number from 110 to 985 first.</div>';
  throw new Error('no answer');
}

// ---- deterministic random from the answer, so reprints match ----
let seed = answer * 7919 + 17;
const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
const between = (a, b) => a + rnd() * (b - a);

const ROWS = 14;
const faultIdx = 8;                        // row of the genuine fault
const first = answer - faultIdx;           // entry code of the first row
const P = (v, i) => Math.round(1.56 * v * i / 1000 * 10) / 10; // MW from kV and A
const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function normalRow() {
  const v = Math.round(between(10.8, 11.2) * 10) / 10;
  const i = Math.round(between(780, 960) / 5) * 5;
  return { v, i, p: P(v, i), f: (50 + between(-0.05, 0.05)).toFixed(2), brk: 'CLOSED', note: 'Normal' };
}
const dead = (note) => ({ v: 0, i: 0, p: 0, f: '0.00', brk: 'OPEN', note });

// A log = rows with a big current at `fIdx`, then a trip and a dead bus.
function buildLog(fIdx) {
  const rows = [];
  for (let k = 0; k < ROWS; k++) {
    let r;
    if (k < fIdx) r = normalRow();
    else if (k === fIdx) {
      const v = Math.round(between(6.0, 6.8) * 10) / 10;
      const i = Math.round(between(4400, 4900) / 10) * 10;
      r = { v, i, p: P(v, i), f: (49.3 + between(0, 0.2)).toFixed(2), brk: 'CLOSED', note: 'Heavy current, alarm' };
    } else if (k === fIdx + 1) r = dead('Breaker tripped');
    else r = dead('Bus dead');
    r.code = first + k;
    r.t = 60 + k * 2; // 01:00, every 2 minutes
    rows.push(r);
  }
  return rows;
}

// Genuine log: passes every check. Has a harmless overload (below pickup) before the fault.
const genuine = buildLog(faultIdx);
const ov = faultIdx - 4;
genuine[ov] = { ...genuine[ov], i: 1180, p: P(genuine[ov].v, 1180), note: 'Load pick-up' };

// Fake A: fault earlier, physics fine, but the clock runs backwards and skips.
const fakeTime = buildLog(faultIdx - 3);
const tb = faultIdx - 4;
fakeTime[tb].t = fakeTime[tb - 1].t - 1;           // time goes backwards
for (let k = tb + 3; k < ROWS; k++) fakeTime[k].t += 3; // and a 5-minute jump

// Fake B: fault later, times fine, but breaker/current and power do not agree.
const fakePhys = buildLog(faultIdx + 3);
const b1 = faultIdx - 5;
fakePhys[b1] = { ...fakePhys[b1], brk: 'OPEN' };                // OPEN with current flowing
const b2 = faultIdx + 1;
fakePhys[b2] = { ...fakePhys[b2], p: Math.round((fakePhys[b2].p + 4.6) * 10) / 10 }; // wrong power
const fb = faultIdx + 3;
fakePhys[fb] = { ...fakePhys[fb], p: Math.round(fakePhys[fb].p * 0.55 * 10) / 10 }; // wrong power at its fault

// Shuffle which sheet letter is genuine, based on the answer.
const logs = [
  { rows: genuine, eng: 'K. Sharma', id: 'G' },
  { rows: fakeTime, eng: 'P. Rao', id: 'T' },
  { rows: fakePhys, eng: 'S. Iyer', id: 'P' },
];
const order = [[0, 1, 2], [1, 0, 2], [1, 2, 0], [2, 0, 1], [0, 2, 1], [2, 1, 0]][answer % 6];
const letters = ['A', 'B', 'C'];
const genuineLetter = letters[order.indexOf(0)];

function sheet(log, letter) {
  return `<section class="sheet">
    <h1>UNIT 4 · CONTROL ROOM LOG ${letter}</h1>
    <h2>Generator feeder G-2 → 11 kV Bus A · Night shift · 26 April</h2>
    <div class="meta">
      <span>Rated feeder current: <b>1000 A</b></span><span>Overcurrent relay pickup: <b>1500 A</b></span>
      <span>Nominal: <b>11 kV, 50 Hz</b></span><span>Logged by: <b>Shift Eng. ${log.eng}</b></span>
    </div>
    <table><thead><tr><th>Entry code</th><th>Time</th><th>Bus voltage (kV)</th><th>Current (A)</th><th>Power (MW)</th><th>Freq (Hz)</th><th>Breaker</th><th>Remarks</th></tr></thead>
    <tbody>${log.rows.map((r) => `<tr><td><b>${r.code}</b></td><td>${hhmm(r.t)}</td><td>${r.v.toFixed(1)}</td><td>${r.i.toLocaleString('en-IN')}</td>
      <td>${r.p.toFixed(1)}</td><td>${r.f}</td><td>${r.brk}</td><td class="l">${r.note}</td></tr>`).join('')}</tbody></table>
    <div class="sign"><div>Shift engineer: ${log.eng}</div><div>Checked by: ____________________</div></div>
    <p style="margin-top:18px"><span class="stamp">CONTROL ROOM COPY</span></p>
  </section>`;
}

const card = `<section class="sheet card">
  <h1>LOG VERIFICATION CARD</h1>
  <h2>Three logs were recovered after the blackout. Only one was kept honestly.</h2>
  <p>A genuine log passes <b>every</b> check below. If a log fails even one, nothing in it can be trusted.</p>
  <ol>
    <li><b>Time.</b> Entries are written every 2 minutes, in order. Time never runs backwards and never skips.</li>
    <li><b>Breaker.</b> When the breaker is OPEN, no current can flow: current and power must both be 0.</li>
    <li><b>Power.</b> Every row must satisfy<br><span class="formula">Power (MW) = 1.56 × Voltage (kV) × Current (A) ÷ 1000</span><br>
        Allow ±0.2 MW for rounding.</li>
    <li><b>Fault.</b> A fault is a current above the relay pickup (1500 A). A current above the rating but below the pickup is an overload, not a fault.</li>
  </ol>
  <p style="font-size:16px;margin-top:22px;border:2px solid #111;padding:10px">
    In the genuine log, find the row where the fault happens.<br><b>Its entry code is your answer.</b></p>
</section>`;

out.innerHTML = order.map((k, n) => sheet(logs[k], letters[n])).join('') + card;
document.getElementById('key').textContent = `Coordinator only: genuine = Log ${genuineLetter}, answer ${answer} (not printed)`;
</script>
</body>
</html>
