# Netlify: static pages from public/, the API from netlify/functions/api.mjs.
# Data is kept in Netlify Blobs automatically (nothing to set up).
# Optional: MASTER_PASSWORD under Project configuration -> Environment variables.
# (If UPSTASH_REDIS_REST_URL / _TOKEN are set, Upstash Redis is used instead.)
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# clean URLs: /master -> master.html
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200
[[redirects]]
  from = "/station"
  to = "/station.html"
  status = 200
[[redirects]]
  from = "/master"
  to = "/master.html"
  status = 200
[[redirects]]
  from = "/level3-logs"
  to = "/level3-logs.html"
  status = 200
